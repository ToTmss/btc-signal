name: btc-summary
on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 min (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: summary, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_and_summarize.py
        env:
          LEV: "40"
          STRATEGIES: "trend_pullback"
          TF_SIGNAL: "1h"
      - name: commit
        run: |
          git config user.name "btc-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add summary.json paper.json
          git diff --cached --quiet || git commit -m "summary $(date -u +%H:%M)" && git push
